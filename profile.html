<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile — RepoSkeleton</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] min-h-screen">
  <!-- Top Navigation (Identical to radar_feed header) -->
  <header class="border-b border-[#30363d] bg-[#161b22] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-2 text-white hover:text-[#58a6ff] transition">
        <span class="mono text-xs px-2 py-0.5 rounded bg-[#21262d] border border-[#30363d] text-[#c9d1d9] font-bold">RS</span>
        <span class="font-semibold text-sm tracking-tight">RepoSkeleton</span>
      </a>
      <a href="/" class="text-xs text-[#8b949e] hover:text-[#c9d1d9] transition flex items-center space-x-1.5">
        <i class="fa-solid fa-arrow-left text-[11px]"></i>
        <span>Back to Radar</span>
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <!-- User Overview Card -->
    <section class="border border-[#30363d] bg-[#161b22] rounded-lg p-6 mb-6">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
        <div class="flex items-center space-x-4">
          <img id="avatar" class="w-16 h-16 rounded-full border border-[#30363d] bg-[#21262d] object-cover" src="https://github.com/ghost.png" alt="Avatar">
          <div>
            <div class="flex items-center space-x-3">
              <h1 id="user-heading" class="text-lg font-bold text-white mono">@loading</h1>
              <a id="github-link" href="#" target="_blank" class="text-xs text-[#58a6ff] hover:underline flex items-center space-x-1">
                <i class="fa-brands fa-github"></i>
                <span>GitHub Profile</span>
              </a>
            </div>
            <p class="text-xs text-[#8b949e] mt-1">Contributor & Maintenance Registry</p>
          </div>
        </div>

        <!-- Metric Badges -->
        <div class="grid grid-cols-3 gap-2 w-full sm:w-auto">
          <div class="border border-[#30363d] bg-[#0d1117] px-4 py-2.5 rounded text-center min-w-[90px]">
            <span class="mono text-[11px] text-[#8b949e] block">Revived</span>
            <span id="stat-revived" class="mono text-base font-bold text-white">0</span>
          </div>
          <div class="border border-[#30363d] bg-[#0d1117] px-4 py-2.5 rounded text-center min-w-[90px]">
            <span class="mono text-[11px] text-[#8b949e] block">WIP</span>
            <span id="stat-wip" class="mono text-base font-bold text-white">0</span>
          </div>
          <div class="border border-[#30363d] bg-[#0d1117] px-4 py-2.5 rounded text-center min-w-[90px]">
            <span class="mono text-[11px] text-[#8b949e] block">Notes</span>
            <span id="stat-comments" class="mono text-base font-bold text-white">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Project Listings -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Revived Panel -->
      <section class="border border-[#30363d] bg-[#161b22] rounded-lg p-5">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-[#30363d]">
          <span class="text-xs font-semibold uppercase tracking-wider text-[#c9d1d9] mono">Revived Projects</span>
          <span class="text-[11px] text-[#8b949e] mono">verified_forks</span>
        </div>
        <div id="revived-list" class="space-y-3">
          <!-- Dinamik içerik -->
        </div>
      </section>

      <!-- WIP Panel -->
      <section class="border border-[#30363d] bg-[#161b22] rounded-lg p-5">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-[#30363d]">
          <span class="text-xs font-semibold uppercase tracking-wider text-[#c9d1d9] mono">Work In Progress</span>
          <span class="text-[11px] text-[#8b949e] mono">active_claims</span>
        </div>
        <div id="wip-list" class="space-y-3">
          <!-- Dinamik içerik -->
        </div>
      </section>
    </div>

    <!-- Discussions / Comments Panel -->
    <section class="border border-[#30363d] bg-[#161b22] rounded-lg p-5 mt-6">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-[#30363d]">
        <span class="text-xs font-semibold uppercase tracking-wider text-[#c9d1d9] mono">Discussions & Notes</span>
        <span class="text-[11px] text-[#8b949e] mono">community_contributions</span>
      </div>
      <div id="comments-list" class="space-y-3">
        <!-- Dinamik içerik -->
      </div>
    </section>
  </main>

  <script>
    const username = window.location.pathname.split("/").filter(Boolean).pop();
    const loggedInUser = localStorage.getItem('gh_user');
    const isOwner = loggedInUser && loggedInUser.toLowerCase() === username.toLowerCase();

    document.getElementById("user-heading").innerText = `@${username}`;
    document.getElementById("avatar").src = `https://github.com/${username}.png`;
    document.getElementById("github-link").href = `https://github.com/${username}`;

    async function releaseProject(repoName) {
      if (!confirm(`Are you sure you want to remove "${repoName}" from your profile and set it back to Dormant?`)) {
        return;
      }
      try {
        const res = await fetch("/api/update-status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repo: repoName,
            status: "dormant",
            user: loggedInUser
          })
        });
        if (res.ok) {
          window.location.reload();
        } else {
          alert("Failed to release project. Please try again.");
        }
      } catch (err) {
        alert("An error occurred while releasing the project.");
      }
    }

    fetch(`/api/user/${username}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("stat-revived").innerText = data.revived_count;
        document.getElementById("stat-wip").innerText = data.wip_count;
        document.getElementById("stat-comments").innerText = data.total_comments;

        const revivedBox = document.getElementById("revived-list");
        if (!data.revived_repos || data.revived_repos.length === 0) {
          revivedBox.innerHTML = `
            <div class="border border-dashed border-[#30363d] rounded p-6 text-center">
              <span class="text-xs text-[#8b949e] mono">No revived projects registered yet.</span>
            </div>
          `;
        } else {
          revivedBox.innerHTML = data.revived_repos.map(r => `
            <div class="border border-[#30363d] bg-[#0d1117] rounded p-3.5 hover:border-[#8b949e] transition">
              <div class="flex items-start justify-between gap-3">
                <span class="mono text-xs font-semibold text-white truncate">${r.repo}</span>
                <div class="flex items-center space-x-2 shrink-0">
                  <span class="mono text-[10px] px-2 py-0.5 rounded bg-[#21262d] border border-[#30363d] text-[#c9d1d9]">REVIVED</span>
                  ${isOwner ? `
                    <button onclick="releaseProject('${r.repo}')" title="Release project back to Dormant" class="text-[11px] text-[#f85149] hover:text-white hover:bg-[#b62324] border border-[#f85149]/40 px-1.5 py-0.5 rounded transition mono">
                      Release
                    </button>
                  ` : ''}
                </div>
              </div>
              ${r.revived_url ? `
                <a href="${r.revived_url}" target="_blank" class="mt-2 text-xs text-[#58a6ff] hover:underline flex items-center space-x-1.5 transition">
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                  <span class="truncate">${r.revived_url}</span>
                </a>
              ` : ''}
            </div>
          `).join('');
        }

        const wipBox = document.getElementById("wip-list");
        if (!data.wip_repos || data.wip_repos.length === 0) {
          wipBox.innerHTML = `
            <div class="border border-dashed border-[#30363d] rounded p-6 text-center">
              <span class="text-xs text-[#8b949e] mono">No active claims currently.</span>
            </div>
          `;
        } else {
          wipBox.innerHTML = data.wip_repos.map(r => `
            <div class="border border-[#30363d] bg-[#0d1117] rounded p-3.5 hover:border-[#8b949e] transition">
              <div class="flex items-start justify-between gap-3">
                <span class="mono text-xs font-semibold text-white truncate">${r.repo}</span>
                <div class="flex items-center space-x-2 shrink-0">
                  <span class="mono text-[10px] px-2 py-0.5 rounded bg-[#21262d] border border-[#30363d] text-[#8b949e]">WIP</span>
                  ${isOwner ? `
                    <button onclick="releaseProject('${r.repo}')" title="Release project back to Dormant" class="text-[11px] text-[#f85149] hover:text-white hover:bg-[#b62324] border border-[#f85149]/40 px-1.5 py-0.5 rounded transition mono">
                      Release
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          `).join('');
        }

        const commentsBox = document.getElementById("comments-list");
        if (commentsBox) {
          if (!data.comments || data.comments.length === 0) {
            commentsBox.innerHTML = `
              <div class="border border-dashed border-[#30363d] rounded p-6 text-center">
                <span class="text-xs text-[#8b949e] mono">No discussion comments recorded yet.</span>
              </div>
            `;
          } else {
            commentsBox.innerHTML = data.comments.map(c => `
              <div class="border border-[#30363d] bg-[#0d1117] rounded p-3.5 hover:border-[#8b949e] transition space-y-2">
                <div class="flex items-center justify-between text-xs">
                  <span class="mono font-semibold text-[#58a6ff] hover:underline cursor-pointer">
                    ${c.repo}
                  </span>
                  <span class="mono text-[10px] text-[#8b949e]">
                    ${c.votes !== undefined ? `+${c.votes} votes` : ''}
                  </span>
                </div>
                <p class="text-xs text-[#c9d1d9] leading-relaxed whitespace-pre-wrap">${c.text || ''}</p>
              </div>
            `).join('');
          }
        }
      })
      .catch(() => {
        document.getElementById("user-heading").innerText = `@${username}`;
      });
  </script>
</body>
</html>
