<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - RepoSkeleton</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .border-subtle { border-color: #30363d; }
      .bg-card { background-color: #161b22; }
      .text-accent { color: #58a6ff; }
      .badge-wip { background: rgba(210, 153, 34, 0.15); color: #e3b341; border: 1px solid rgba(210, 153, 34, 0.4); }
      .badge-revived { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="border-b border-subtle bg-[#161b22] px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <a href="/" class="flex items-center gap-3 text-lg font-bold text-white hover:text-[#58a6ff] transition">
            <img src="/favicon.svg" alt="Logo" class="w-7 h-7">
            <span>RepoSkeleton</span>
        </a>
        <a href="/" class="text-sm text-gray-400 hover:text-white transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Ana Sayfa
        </a>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 py-10 flex-1">
        <!-- Profile Header Card -->
        <div class="bg-card border border-subtle rounded-xl p-6 mb-8 flex flex-col sm:flex-row items-center sm:items-start gap-6">
            <img id="user-avatar" src="https://github.com/ghost.png" alt="Avatar" class="w-24 h-24 rounded-full border border-subtle bg-[#0d1117]">
            <div class="flex-1 text-center sm:text-left">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
                    <div>
                        <h1 id="user-name" class="text-2xl font-bold text-white">Loading...</h1>
                        <p id="user-handle" class="text-gray-400 text-sm">@...</p>
                    </div>
                    <a id="github-link" href="#" target="_blank" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-white text-sm font-medium rounded-lg border border-subtle transition">
                        <i class="fa-brands fa-github"></i> View GitHub Profile
                    </a>
                </div>

                <!-- Statistics -->
                <div class="flex items-center justify-center sm:justify-start gap-6 mt-6 border-t border-subtle pt-4 text-sm">
                    <div>
                        <span id="stat-revived" class="font-bold text-white text-lg block">0</span>
                        <span class="text-gray-400 text-xs">Revived</span>
                    </div>
                    <div class="w-px h-8 bg-[#30363d]"></div>
                    <div>
                        <span id="stat-wip" class="font-bold text-white text-lg block">0</span>
                        <span class="text-gray-400 text-xs">In Progress (WIP)</span>
                    </div>
                    <div class="w-px h-8 bg-[#30363d]"></div>
                    <div>
                        <span id="stat-comments" class="font-bold text-white text-lg block">0</span>
                        <span class="text-gray-400 text-xs">Comments & Discussions</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Projects & Contributions -->
        <div class="space-y-6">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                <i class="fa-solid fa-code-fork text-accent"></i> Projects & Contributions
            </h2>
            <div id="repos-container" class="grid gap-4 sm:grid-cols-2">
                <div class="col-span-2 text-center text-gray-500 py-8">Loading projects...</div>
            </div>

            <h2 class="text-lg font-semibold text-white flex items-center gap-2 mt-8">
                <i class="fa-regular fa-comments text-accent"></i> Discussion Comments
            </h2>
            <div id="comments-container" class="space-y-3">
                <div class="text-center text-gray-500 py-6">No comments yet.</div>
            </div>
        </div>
    </main>

    <footer class="border-t border-subtle py-6 text-center text-xs text-gray-500">
        RepoSkeleton &copy; 2026 - Reviving Dead Repositories
    </footer>

    <script>
        // 1. Extract username from URL params or path
        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('user');

        if (!username) {
            // Check path format like /profile/username
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            if (pathSegments.length > 0 && pathSegments[pathSegments.length - 1] !== 'profile.html' && pathSegments[pathSegments.length - 1] !== 'profile') {
                username = pathSegments[pathSegments.length - 1];
            }
        }

        if (!username) {
            const storedUser = localStorage.getItem('user');
            if (storedUser) {
                try {
                    const u = JSON.parse(storedUser);
                    username = u.login || u.username;
                } catch(e) {
                    username = storedUser;
                }
            }
        }

        if (!username) {
            document.getElementById('user-name').innerText = "User Not Specified";
            document.getElementById('user-handle').innerText = "URL'de ?user=kullanici_adi ekleyin.";
        } else {
            // Trim string to normalize whitespace
            username = username.trim();

            fetch(`/api/user/${encodeURIComponent(username)}`)
                .then(r => {
                    if (!r.ok) throw new Error("User not found");
                    return r.json();
                })
                .then(data => {
                    const uname = data.username || username;
                    document.getElementById('user-name').innerText = uname;
                    document.getElementById('user-handle').innerText = `@${uname}`;
                    document.getElementById('user-avatar').src = `https://github.com/${uname}.png`;
                    document.getElementById('github-link').href = `https://github.com/${uname}`;

                    // Support both raw fields and stats object format
                    const revivedCount = data.revived_count ?? (data.stats ? data.stats.revived_count : 0);
                    const wipCount = data.wip_count ?? (data.stats ? data.stats.wip_count : 0);
                    const commentCount = data.total_comments ?? (data.stats ? data.stats.comment_count : (data.comments ? data.comments.length : 0));

                    document.getElementById('stat-revived').innerText = revivedCount;
                    document.getElementById('stat-wip').innerText = wipCount;
                    document.getElementById('stat-comments').innerText = commentCount;

                    // Merge repositories from all supported schema formats
                    let repos = [];
                    if (Array.isArray(data.repos)) {
                        repos = data.repos;
                    } else {
                        if (Array.isArray(data.revived_repos)) repos.push(...data.revived_repos);
                        if (Array.isArray(data.wip_repos)) repos.push(...data.wip_repos);
                    }

                    const repoBox = document.getElementById('repos-container');
                    if (repos.length === 0) {
                        repoBox.innerHTML = '<div class="col-span-2 bg-card border border-subtle rounded-xl p-6 text-center text-gray-400">This developer has not claimed or revived any repository yet.</div>';
                    } else {
                        repoBox.innerHTML = repos.map(r => {
                            const repoTitle = r.repo || r.name;
                            const isRevived = (r.status || '').toLowerCase() === 'revived';
                            const forkUrl = r.revived_url;

                            return `
                                <div class="bg-card border border-subtle p-4 rounded-xl flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-xs px-2.5 py-0.5 rounded-full font-medium ${isRevived ? 'badge-revived' : 'badge-wip'}">
                                                ${isRevived ? 'Revived' : 'In Progress'}
                                            </span>
                                        </div>
                                        <h3 class="font-bold text-white text-base truncate" title="${repoTitle}">${repoTitle}</h3>
                                    </div>
                                    <div class="mt-4 pt-3 border-t border-subtle flex justify-between items-center text-xs">
                                        <a href="/?search=${encodeURIComponent(repoTitle)}" class="text-accent hover:underline">View Repository &rarr;</a>
                                        ${forkUrl ? `<a href="${forkUrl}" target="_blank" class="text-gray-400 hover:text-white"><i class="fa-solid fa-external-link"></i> Fork URL</a>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }

                    // Render comments list
                    const commBox = document.getElementById('comments-container');
                    const comments = Array.isArray(data.comments) ? data.comments : [];
                    if (comments.length === 0) {
                        commBox.innerHTML = '<div class="bg-card border border-subtle rounded-xl p-6 text-center text-gray-400">No discussion comments found for this developer.</div>';
                    } else {
                        commBox.innerHTML = comments.map(c => {
                            const repoName = c.repo || '';
                            const cText = c.text || (c.comment ? c.comment.text : '');
                            return `
                                <div class="bg-card border border-subtle p-4 rounded-xl text-sm">
                                    <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
                                        <span class="font-semibold text-white">${repoName}</span>
                                        <span>${c.created_at || c.time || ''}</span>
                                    </div>
                                    <p class="text-gray-300">${cText}</p>
                                </div>
                            `;
                        }).join('');
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('user-name').innerText = "User Not Found";
                    document.getElementById('user-handle').innerText = `@${username}`;
                    document.getElementById('repos-container').innerHTML = '<div class="col-span-2 text-center text-red-400 py-6">Failed to load developer profile or user does not exist.</div>';
                });
        }
    </script>
</body>
</html>
