<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - RepoSkeleton</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .border-subtle { border-color: #30363d; }
      .bg-card { background-color: #161b22; }
      .text-accent { color: #58a6ff; }
      .badge-wip { background: rgba(210, 153, 34, 0.15); color: #e3b341; border: 1px solid rgba(210, 153, 34, 0.4); }
      .badge-revived { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
    </style>
</head>
<body class="min-vh-100 flex flex-col justify-between">
    <header class="border-b border-subtle bg-[#161b22] px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <a href="/" class="flex items-center gap-3 text-lg font-bold text-white hover:text-[#58a6ff] transition">
            <img src="/favicon.svg" alt="Logo" class="w-7 h-7">
            <span>RepoSkeleton</span>
        </a>
        <a href="/" class="text-sm text-gray-400 hover:text-white transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Geri Dön
        </a>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 py-10 flex-1">
        <!-- Profil Başlık Kartı -->
        <div class="bg-card border border-subtle rounded-xl p-6 mb-8 flex flex-col sm:flex-row items-center sm:items-start gap-6">
            <img id="user-avatar" src="https://github.com/ghost.png" alt="Avatar" class="w-24 h-24 rounded-full border border-subtle bg-[#0d1117]">
            <div class="flex-1 text-center sm:text-left">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
                    <div>
                        <h1 id="user-name" class="text-2xl font-bold text-white">Yükleniyor...</h1>
                        <p id="user-handle" class="text-gray-400 text-sm">@...</p>
                    </div>
                    <a id="github-link" href="#" target="_blank" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#21262d] hover:bg-[#30363d] text-white text-sm font-medium rounded-lg border border-subtle transition">
                        <i class="fa-brands fa-github"></i> GitHub Profilinde Gör
                    </a>
                </div>

                <!-- İstatistikler -->
                <div class="flex items-center justify-center sm:justify-start gap-6 mt-6 border-t border-subtle pt-4 text-sm">
                    <div>
                        <span id="stat-revived" class="font-bold text-white text-lg block">0</span>
                        <span class="text-gray-400 text-xs">Canlandırılan (Revived)</span>
                    </div>
                    <div class="w-px h-8 bg-[#30363d]"></div>
                    <div>
                        <span id="stat-wip" class="font-bold text-white text-lg block">0</span>
                        <span class="text-gray-400 text-xs">Üzerinde Çalışılan (WIP)</span>
                    </div>
                    <div class="w-px h-8 bg-[#30363d]"></div>
                    <div>
                        <span id="stat-comments" class="font-bold text-white text-lg block">0</span>
                        <span class="text-gray-400 text-xs">Tartışma & Yorum</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sekmeler -->
        <div class="space-y-6">
            <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                <i class="fa-solid fa-code-fork text-accent"></i> Projeler & Katkılar
            </h2>
            <div id="repos-container" class="grid gap-4 sm:grid-cols-2">
                <div class="col-span-2 text-center text-gray-500 py-8">Projeler aranıyor...</div>
            </div>

            <h2 class="text-lg font-semibold text-white flex items-center gap-2 mt-8">
                <i class="fa-regular fa-comments text-accent"></i> Son Topluluk Yorumları
            </h2>
            <div id="comments-container" class="space-y-3">
                <div class="text-center text-gray-500 py-6">Henüz bir yorum yok.</div>
            </div>
        </div>
    </main>

    <footer class="border-t border-subtle py-6 text-center text-xs text-gray-500">
        RepoSkeleton &copy; 2026 - Reviving Dead Repositories
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('user');

        if (!username) {
            // URL'de parametre yoksa oturumdaki kullanıcıya bak
            const storedUser = localStorage.getItem('user');
            if (storedUser) {
                try {
                    const u = JSON.parse(storedUser);
                    username = u.login || u.username;
                } catch(e) {
                    username = storedUser;
                }
            }
        }

        if (!username) {
            document.getElementById('user-name').innerText = "Kullanıcı Bulunamadı";
            document.getElementById('user-handle').innerText = "Lütfen bir kullanıcı belirtin.";
        } else {
            fetch(`/api/user/${username}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('user-name').innerText = data.username;
                    document.getElementById('user-handle').innerText = `@${data.username}`;
                    document.getElementById('user-avatar').src = `https://github.com/${data.username}.png`;
                    document.getElementById('github-link').href = `https://github.com/${data.username}`;

                    document.getElementById('stat-revived').innerText = data.stats.revived_count;
                    document.getElementById('stat-wip').innerText = data.stats.wip_count;
                    document.getElementById('stat-comments').innerText = data.stats.comment_count;

                    // Repoları Render Et
                    const repoBox = document.getElementById('repos-container');
                    const allRepos = [...data.revived_repos, ...data.wip_repos];
                    if (allRepos.length === 0) {
                        repoBox.innerHTML = '<div class="col-span-2 bg-card border border-subtle rounded-xl p-6 text-center text-gray-400">Bu kullanıcı henüz bir repoyu canlandırma sürecine katılmadı.</div>';
                    } else {
                        repoBox.innerHTML = allRepos.map(r => `
                            <div class="bg-card border border-subtle p-4 rounded-xl flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-xs px-2.5 py-0.5 rounded-full font-medium ${r.status === 'revived' ? 'badge-revived' : 'badge-wip'}">
                                            ${r.status === 'revived' ? 'Revived 🎉' : 'In Progress ⏳'}
                                        </span>
                                    </div>
                                    <h3 class="font-bold text-white text-base truncate">${r.name}</h3>
                                </div>
                                <div class="mt-4 pt-3 border-t border-subtle flex justify-between items-center text-xs">
                                    <a href="/?search=${encodeURIComponent(r.name)}" class="text-accent hover:underline">Repoyu İncele &rarr;</a>
                                    ${r.revived_url ? `<a href="${r.revived_url}" target="_blank" class="text-gray-400 hover:text-white"><i class="fa-solid fa-external-link"></i> Fork URL</a>` : ''}
                                </div>
                            </div>
                        `).join('');
                    }

                    // Yorumları Render Et
                    const commBox = document.getElementById('comments-container');
                    if (data.comments.length === 0) {
                        commBox.innerHTML = '<div class="bg-card border border-subtle rounded-xl p-6 text-center text-gray-400">Bu kullanıcının henüz bir tartışma yorumu bulunmuyor.</div>';
                    } else {
                        commBox.innerHTML = data.comments.map(c => `
                            <div class="bg-card border border-subtle p-4 rounded-xl text-sm">
                                <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
                                    <span class="font-semibold text-white">${c.repo}</span>
                                    <span>${c.comment.time || ''}</span>
                                </div>
                                <p class="text-gray-300">${c.comment.text}</p>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('user-name').innerText = "Hata oluştu";
                });
        }
    </script>
</body>
</html>
